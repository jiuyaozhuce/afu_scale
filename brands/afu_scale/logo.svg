<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42a5f5"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eceff1"/>
      <stop offset="1" stop-color="#b0bec5"/>
    </linearGradient>
  </defs>
  <!-- 圆角背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#0d1b2a"/>
  <!-- 秤体：圆角方形玻璃面板 -->
  <rect x="96" y="76" width="320" height="360" rx="56" fill="url(#body)"/>
  <rect x="96" y="76" width="320" height="360" rx="56" fill="none" stroke="#90caf9" stroke-opacity="0.5" stroke-width="6"/>
  <!-- 四角电极片（体脂秤特征） -->
  <ellipse cx="170" cy="150" rx="34" ry="26" fill="url(#glass)"/>
  <ellipse cx="342" cy="150" rx="34" ry="26" fill="url(#glass)"/>
  <ellipse cx="170" cy="362" rx="34" ry="26" fill="url(#glass)"/>
  <ellipse cx="342" cy="362" rx="34" ry="26" fill="url(#glass)"/>
  <!-- 中央 LED 显示屏 -->
  <rect x="206" y="230" width="100" height="52" rx="12" fill="#0a2540"/>
  <!-- 体重数字 68.2 -->
  <g fill="#4dd0e1" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="bold">
    <text x="256" y="268" text-anchor="middle">68.2</text>
  </g>
  <!-- 下方百分比符号（BIA 体脂特征） -->
  <g stroke="#4dd0e1" stroke-width="7" fill="none" stroke-linecap="round">
    <circle cx="238" cy="316" r="8"/>
    <circle cx="274" cy="344" r="8"/>
    <line x1="270" y1="312" x2="242" y2="348"/>
  </g>
</svg>
